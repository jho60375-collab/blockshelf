    }

    }

    a {

      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    button,
    input {
      font: inherit;
      letter-spacing: 0;
    }

    .site-shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    .site-header {

      text-align: center;
    }

    .brand {

      align-items: center;

      font-weight: 400;
      line-height: 1;
      text-transform: uppercase;
    }

    .top-links {

      gap: 0 12px;
      margin-top: 14px;
      color: var(--blue);
      font-size: 0.95rem;
    }

    .top-links a::after {
      content: " /";
      margin-left: 10px;
    }

    .top-links a:last-child::after {
      content: "";
      margin: 0;
    }

    .hero {
      min-height: 46vh;
      display: grid;
      align-content: center;
      justify-items: center;
      padding: 34px 0 22px;
      text-align: center;
    }

    .script-word {

      color: var(--blue);
      font-family: "Segoe Script", "Brush Script MT", "Snell Roundhand", cursive;

      font-weight: 400;
      line-height: 0.82;
      letter-spacing: 0;
    }

    .hero-meta {
      margin: 28px 0 0;
      color: var(--blue);
      font-size: 0.95rem;
      font-style: italic;
    }

    .flow {

      margin-top: 26px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 8px 6px 18px;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }

    .flow-track {
      min-width: max-content;
      display: flex;
      align-items: end;
      justify-content: center;
      gap: 10px;
    }

    .flow-card {
      width: clamp(84px, 10vw, 132px);
      aspect-ratio: 1 / 1.18;
      border: 1px solid rgba(0, 47, 167, 0.14);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 18px 36px rgba(0, 47, 167, 0.08);
      transform: translateY(var(--drop, 0)) rotate(var(--angle, 0));
      opacity: var(--fade, 1);
      display: grid;
      place-items: center;
      padding: 12px;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, opacity 160ms ease;

    .flow-card:hover,
    .flow-card:focus-visible {
      transform: translateY(-6px) rotate(0);
      box-shadow: 0 22px 46px rgba(0, 47, 167, 0.14);
      outline: none;
      opacity: 1;

    .flow-card img {

      height: 94%;
      object-fit: contain;
    }

    .tools {

      top: 0;
      z-index: 10;
      margin: 4px 0 26px;
      padding: 16px 0 14px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(18px);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);

      align-items: center;
      gap: 12px;

      line-height: 1.22;

      text-align: center;

      background: var(--blue);
      color: #fff;

    .module-actions span {

      background: var(--wash);

  <script>
    (function () {
      var catalog = JSON.parse(document.getElementById("catalog-data").textContent);
      var grid = document.getElementById("grid");
      var flow = document.getElementById("flow");
      var categories = document.getElementById("categories");
      var search = document.getElementById("search");
      var count = document.getElementById("count");
      var empty = document.getElementById("empty");
      var downloadAll = document.getElementById("download-all");
      var footerSummary = document.getElementById("footer-summary");
      var activeCategory = "All";
      var flowAngles = [-7, -4, -2, 0, 3, 6, -5, 2, 5, -3, 4, -6, 1, -2, 4, -5, 3, -1];

      if (catalog.allZip) {
        downloadAll.href = catalog.allZip;
        downloadAll.setAttribute("download", "BLOCKSHELF-Furniture-DWG.zip");
      } else {
        downloadAll.setAttribute("aria-disabled", "true");
      }

      footerSummary.textContent = catalog.productCount + " modules / " + catalog.categoryCount + " categories / " + catalog.dwgCount + " DWG";

      function normalize(value) {
        return String(value || "").toLowerCase().normalize("NFKD");
      }

      function setActiveCategory(category) {
        activeCategory = category;
        Array.prototype.forEach.call(categories.querySelectorAll("button"), function (button) {
          button.setAttribute("aria-pressed", button.dataset.category === activeCategory ? "true" : "false");
        });
        renderGrid();
      }

      function renderCategories() {
        categories.textContent = "";
        var allButton = document.createElement("button");
        allButton.type = "button";
        allButton.dataset.category = "All";
        allButton.textContent = "全部 All (" + catalog.productCount + ")";
        allButton.setAttribute("aria-pressed", "true");
        allButton.addEventListener("click", function () {
          setActiveCategory("All");
        });
        categories.appendChild(allButton);

        catalog.categories.forEach(function (category) {
          var button = document.createElement("button");
          button.type = "button";
          button.dataset.category = category.name;
          button.textContent = category.name + " (" + category.count + ")";
          button.setAttribute("aria-pressed", "false");
          button.addEventListener("click", function () {
            setActiveCategory(category.name);
          });
          categories.appendChild(button);
        });
      }

      function createActionLink(label, href, downloadName) {
        var link = document.createElement("a");
        link.textContent = label;
        link.href = href;
        if (downloadName) link.setAttribute("download", downloadName);
        return link;
      }

      function createCard(item) {
        var card = document.createElement("article");
        card.className = "module-card";
        card.id = "item-" + item.id;

        var previewLink = document.createElement(item.hasDwg ? "a" : "div");
        previewLink.className = "preview-link";
        if (item.hasDwg) {
          previewLink.href = item.dwg;
          previewLink.setAttribute("download", item.downloadName);
          previewLink.setAttribute("aria-label", "Download " + item.name);
        }

        if (item.preview) {
          var image = document.createElement("img");
          image.src = item.preview;
          image.alt = item.name + " preview";
          image.loading = "lazy";
          previewLink.appendChild(image);
        }

        var body = document.createElement("div");
        body.className = "module-body";

        var kicker = document.createElement("div");
        kicker.className = "module-kicker";
        kicker.textContent = item.category + " / " + String(item.no).padStart(3, "0");

        var title = document.createElement("h3");
        title.className = "module-title";
        title.textContent = item.name;

        var actions = document.createElement("div");
        actions.className = "module-actions";
        if (item.hasDwg) {
          actions.appendChild(createActionLink("DWG", item.dwg, item.downloadName));
        } else {
          var missing = document.createElement("span");
          missing.textContent = "DWG missing";
          actions.appendChild(missing);
        }
        actions.appendChild(createActionLink("SVG", item.preview || "#", item.id + ".svg"));

        body.appendChild(kicker);
        body.appendChild(title);
        body.appendChild(actions);
        card.appendChild(previewLink);
        card.appendChild(body);
        return card;
      }

      function matches(item, query) {
        var haystack = normalize(item.name + " " + item.category + " " + item.downloadName);
        var categoryOk = activeCategory === "All" || item.category === activeCategory;
        return categoryOk && (!query || haystack.indexOf(query) !== -1);
      }

      function renderGrid() {
        var query = normalize(search.value.trim());
        var visible = catalog.items.filter(function (item) {
          return matches(item, query);
        });

        grid.textContent = "";
        visible.forEach(function (item) {
          grid.appendChild(createCard(item));
        });

        count.textContent = visible.length + " / " + catalog.productCount + " modules";
        empty.classList.toggle("is-visible", visible.length === 0);
      }

      function renderFlow() {
        flow.textContent = "";
        catalog.featured.forEach(function (item, index) {
          var button = document.createElement("button");
          button.type = "button";
          button.className = "flow-card";
          button.style.setProperty("--angle", flowAngles[index % flowAngles.length] + "deg");
          button.style.setProperty("--drop", index % 3 === 0 ? "10px" : index % 3 === 1 ? "0" : "18px");
          button.style.setProperty("--fade", String(0.56 + Math.min(index, 8) * 0.055));
          button.setAttribute("aria-label", "Show " + item.category);

          var image = document.createElement("img");
          image.src = item.preview;
          image.alt = "";
          image.loading = "lazy";
          button.appendChild(image);
          button.addEventListener("click", function () {
            search.value = "";
            setActiveCategory(item.category);
            document.getElementById("library").scrollIntoView({ behavior: "smooth", block: "start" });
          });
          flow.appendChild(button);
        });
      }

      search.addEventListener("input", renderGrid);
      renderCategories();
      renderFlow();
      renderGrid();
    })();
  </script>
